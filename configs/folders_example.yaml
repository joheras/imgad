# Custom dataset organised in folders
data:
  type: folders
  name: mi_dataset
  train_normal: /path/train/normal
  test_normal: /path/test/normal
  test_anomalous: [/path/test/defecto_a, /path/test/defecto_b]

cache_dir: .feature_cache

extractors:
  - openai/clip-vit-base-patch32          # a plain string = HF model with default options
  - {type: hf, model_name: facebook/dinov2-small}

preprocessing:
  - [l2]

detectors:
  - {name: knn, k: 1}
  - mahalanobis
  - iforest
