- zoo:biomedclip
- zoo:dinov2-base
- zoo:siglip2-base
- zoo:retfound-cfp
- zoo:retfound-dinov2
- zoo:medsiglip
- zoo:dinov3-vitb16
preprocessing:
- - l2
- - l2
  - pca:0.95
detectors:
- name: knn
  k: 1
- name: knn
  k: 5
- mahalanobis
- centroid
- name: kmeans
  n_clusters: 8
- lof
- gmm
- kde
- ocsvm
- iforest
- pca
- name: ensemble
  members:
  - name: knn
    k: 1
  - mahalanobis
- name: zero_shot
  modality: fundus
- name: zero_shot
  modality: fundus
  mode: text
  normal:
  - a healthy retina
  - a normal fundus
  - a tessellated fundus without atrophy
  - a myopic fundus without lesions
  anomalous:
  - pathologic myopia
  - myopic maculopathy
  - diffuse chorioretinal atrophy
  - patchy chorioretinal atrophy
  - macular atrophy
  - lacquer cracks
  - myopic choroidal neovascularization
  - a posterior staphyloma
- name: zero_shot
  modality: fundus
  mode: both
  normal:
  - a healthy retina
  - a normal fundus
