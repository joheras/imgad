data:
  type: mvtec
  root: /home/coco/PALM/imgad/data/palm_imgad
  categories:
  - palm-val
  - palm-test
cache_dir: .feature_cache
seeds:
- 0
- 1
- 2
train_subsample: 0.8
bootstrap: 1000
ci_alpha: 0.05
on_error: continue
extractors:
- zoo:retfound-green
- zoo:visionfm-fundus
- zoo:flair
- zoo:urfound
- zoo:retizero
- zoo:retfound-cfp-mirror
- zoo:flair-clip
